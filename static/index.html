<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伴走型AIチューター</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>
    
    <header class="app-header">
        <h1>🎓 伴走型AIチューター</h1>
        <p>生徒の学習履歴から「発達の最近接領域（ZPD）」を分析し、最適な問題を生成します</p>
    </header>

    <main class="app-container">
        <!-- 左カラム：履歴入力 -->
        <section class="panel history-panel glass">
            <h2>📊 学習履歴の登録</h2>
            <form id="history-form" class="history-form">
                <div class="form-group">
                    <label for="genre">ジャンル</label>
                    <select id="genre" required>
                        <option value="" disabled selected>選択してください</option>
                        <option value="数学/一次方程式">数学/一次方程式</option>
                        <option value="数学/連立方程式">数学/連立方程式</option>
                        <option value="数学/二次方程式">数学/二次方程式</option>
                        <option value="数学/平方根">数学/平方根</option>
                        <option value="数学/三平方の定理">数学/三平方の定理</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="difficulty">難易度 (0.0〜1.0)</label>
                    <div class="range-slider">
                        <input type="range" id="difficulty" min="0" max="1" step="0.1" value="0.5">
                        <span id="difficulty-val">0.5</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>結果</label>
                    <div class="radio-group">
                        <label class="radio-btn">
                            <input type="radio" name="is_correct" value="true" checked>
                            <span class="btn-content">✅ 正解</span>
                        </label>
                        <label class="radio-btn">
                            <input type="radio" name="is_correct" value="false">
                            <span class="btn-content">❌ 不正解</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="time_spent">解答時間 (秒)</label>
                    <input type="number" id="time_spent" value="60" min="1">
                </div>

                <button type="submit" class="btn primary-btn btn-add">＋ 履歴に追加</button>
            </form>

            <div class="history-list-container">
                <h3>現在のセッション履歴 <span class="badge" id="history-count">0</span></h3>
                <ul id="history-list" class="history-list">
                    <!-- 履歴アイテムがここに追加される -->
                    <li class="empty-state">履歴がありません</li>
                </ul>
            </div>
            
            <div class="action-container">
                <button id="generate-btn" class="btn magic-btn" disabled>
                    <span class="btn-text">🚀 AIに問題を出してもらう</span>
                    <span class="loader hidden"></span>
                </button>
            </div>
        </section>

        <!-- 右カラム：結果表示 -->
        <section class="panel result-panel glass">
            <h2>💡 AIからの推薦</h2>
            
            <div id="result-content" class="result-content empty">
                <div class="waiting-state">
                    <div class="pulse-ring"></div>
                    <p>学習履歴を追加して、「AIに問題を出してもらう」をクリックしてください</p>
                </div>
            </div>
            
            <!-- 結果テンプレート (JSでクローンして使用) -->
            <template id="result-template">
                <div class="recommendation-card fade-in">
                    <div class="badge-target">🎯 ターゲット: <span class="target-genre-text"></span></div>
                    
                    <div class="info-block rationale-block">
                        <h4>📝 ZPD判定理由</h4>
                        <p class="rationale-text"></p>
                    </div>

                    <div class="info-block question-block">
                        <h4>❓ 問題</h4>
                        <p class="question-text"></p>
                    </div>
                    
                    <div class="info-block advice-block">
                        <h4>💬 学習アドバイス</h4>
                        <p class="advice-text"></p>
                    </div>

                    <div class="info-block explanation-block">
                        <h4>📖 解説・ヒント</h4>
                        <p class="explanation-text"></p>
                    </div>
                </div>
            </template>
        </section>
    </main>

    <footer class="app-footer">
        <p>AI Tutor System &copy; 2026</p>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
